  ═══════════════════════════════════════ -->
  <rect x="0" y="32" width="900" height="316" class="bg-alt"/>
  <text class="section" x="10" y="46" text-decoration="none">INFRA &amp; DB</text>
  <line x1="0" y1="32" x2="900" y2="32" class="sep"/>

