<svg width="900" height="1080" viewBox="0 0 900 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama de Gantt del projecte CursoHub">
  <title>Gantt CursoHub — dic 2025 · mai 2026</title>
  <desc>Diagrama de Gantt detallat del projecte CursoHub des del 20 de desembre de 2025 fins al 5 de maig de 2026, dividit en Infra &amp; DB, Backend i Frontend.</desc>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg       { fill: #ffffff; }
    .bg-alt   { fill: #f6f8fa; }
    .grid     { stroke: #d0d7de; stroke-width: 0.5; }
    .grid-dash{ stroke: #d0d7de; stroke-width: 0.5; stroke-dasharray: 3 3; }
    .sep      { stroke: #d0d7de; stroke-width: 0.8; }
    .sep-row  { stroke: #e8ecf0; stroke-width: 0.5; }
    .lbl      { fill: #57606a; font-size: 11px; }
    .lbl-sm   { fill: #57606a; font-size: 10px; }
    .section  { fill: #57606a; font-size: 9.5px; font-weight: 600; letter-spacing: 0.06em; }
    .end-line { stroke: #cf222e; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .end-txt  { fill: #cf222e; font-size: 10px; }
    .month    { fill: #6e7781; font-size: 10.5px; }

    /* Bar text */
    .bt-purple { fill: #eeedfe; font-size: 9.5px; }
    .bt-green  { fill: #e1f5ee; font-size: 9.5px; }
    .bt-amber  { fill: #faeeda; font-size: 9.5px; }
    .bt-gray   { fill: #f1efe8; font-size: 9.5px; }

    @media (prefers-color-scheme: dark) {
      .bg       { fill: #0d1117; }
      .bg-alt   { fill: #161b22; }
      .grid     { stroke: #30363d; }
      .grid-dash{ stroke: #30363d; stroke-dasharray: 3 3; }
      .sep      { stroke: #30363d; }
      .sep-row  { stroke: #21262d; }
      .lbl      { fill: #8b949e; }
      .lbl-sm   { fill: #8b949e; }
      .section  { fill: #8b949e; }
      .end-line { stroke: #f85149; }
      .end-txt  { fill: #f85149; }
      .month    { fill: #8b949e; }
    }
  </style>

  <!-- Background -->
  <rect width="900" height="1080" class="bg"/>

  <!--
    Timeline: Dec 20 2025 → May 5 2026 = 136 days
    Chart x: 230 → 870  (640px)   1 day = 640/136 ≈ 4.706px
    x(d) = 230 + d*4.706

    Key x positions:
    d0  Dec 20 → 230
    d12 Jan  1 → 286
    d26 Jan 15 → 352
    d43 Feb  1 → 432
    d56 Feb 13 → 493
    d68 Feb 25 → 550
    d71 Mar  1 → 564
    d84 Mar 14 → 625
    d90 Mar 19 → 654
    d97 Mar 26 → 687
    d104 Apr 2 → 719
    d124 Apr 23→ 813
    d131 Apr 30→ 846
    d136 May  5→ 870
  -->

  <!-- Month labels -->
  <text class="month" x="230" y="22">Dic '25</text>
  <text class="month" x="286" y="22">Gen '26</text>
  <text class="month" x="432" y="22">Feb</text>
  <text class="month" x="564" y="22">Mar</text>
  <text class="month" x="667" y="22">Abr</text>
  <text class="month" x="846" y="22">Mai</text>

  <!-- Grid verticals -->
  <line x1="230" y1="28" x2="230" y2="1048" class="grid"/>
  <line x1="286" y1="28" x2="286" y2="1048" class="grid-dash"/>
  <line x1="432" y1="28" x2="432" y2="1048" class="grid-dash"/>
  <line x1="564" y1="28" x2="564" y2="1048" class="grid-dash"/>
  <line x1="667" y1="28" x2="667" y2="1048" class="grid-dash"/>
  <line x1="846" y1="28" x2="846" y2="1048" class="grid-dash"/>
  <line x1="870" y1="28" x2="870" y2="1048" class="grid"/>

