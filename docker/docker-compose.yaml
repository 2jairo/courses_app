services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      -  ./dbs/rmq_data:/var/lib/rabbitmq
  
  pg_timescaledb:
    image: timescale/timescaledb-ha:pg16
    environment:
      - POSTGRES_PASSWORD=1234
      - POSTGRES_USER=user
      - POSTGRES_DB=courses
    ports:
      - "5432:5432"
    volumes:
      - ./dbs/postgres_data:/home/postgres/pgdata
    
  clickhouse: # docker exec -it 21341234 clickhouse-client
    image: clickhouse/clickhouse-server:25.8
    environment:
      - CLICKHOUSE_PASSWORD=1234
      - CLICKHOUSE_USER=user
      - CLICKHOUSE_DB=courses
    ports: 
      - "8123:8123"
      - "9000:9000"
      - "9009:9009"
    volumes:
      - ./dbs/clickhouse/data:/var/lib/clickhouse
      - ./dbs/clickhouse/logs:/var/log/clickhouse-server

  migrations:
    build: ../backend/migrations
    container_name: migrations
    depends_on:
      - rabbitmq
      - pg_timescaledb
      - clickhouse
    env_file:
      - ../backend/migrations/.env.docker
      - ./wait-for-it.sh:/migrations/wait-for-it.sh
 
  a_core_service:
    build: ../backend/A_core_service
    container_name: a_core_service
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - migrations 
      - rabbitmq
      - pg_timescaledb
      - clickhouse
    volumes:
      - ../backend/A_core_service/.env.docker:/app/.env.production
      - ./files/raw:/app/raw
      - ./files/noraw:/app/noraw
      - ./wait-for-it.sh:/app/wait-for-it.sh

  b_identity_service:
    build: ../backend/B_identity_service
    container_name: b_identity_service
    ports:
      - "3001:3001"
    restart: unless-stopped
    depends_on:
      - migrations
      - rabbitmq
      - pg_timescaledb
    volumes:
      - ../backend/B_identity_service/.env.docker:/app/.env.production
      - ./wait-for-it.sh:/app/wait-for-it.sh

  c_media_service:
    build: ../backend/C_media_service
    container_name: c_media_service
    restart: unless-stopped
    depends_on:
      - rabbitmq
    volumes:
      - ../backend/C_media_service/.env.docker:/app/.env.production
      - ../backend/C_media_service/ggml-small.bin:/app/ggml-small.bin
      - ./files/raw:/app/raw
      - ./files/noraw:/app/noraw
      - ./wait-for-it.sh:/app/wait-for-it.sh
    deploy: # For CUDA support, uncomment:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]