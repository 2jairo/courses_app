worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # Serve protected files
        location /files/ {
            # Reject missing token early
            if ($arg_token = "") {
                return 401;
            }

            auth_request /_auth;

            root /var/www;
            try_files $uri =404;
        }

        # Authorization subrequest
        location = /_auth {
            internal;

            proxy_pass http://auth:8080;

            # Forward request context
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Access-Token $arg_token;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Args $args;

            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        error_page 401 403 = @deny;

        location @deny {
            return 403;
        }
    }
}
