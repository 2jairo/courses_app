[package]
name = "c_worker"
version = "0.1.0"
edition = "2024"

[dependencies]
gstreamer = { version = "0.24.4", features = ["v1_26"] }
gstreamer-app = { version = "0.24.4", features = ["v1_26"] }
gstreamer-pbutils = { version = "0.24.4", features = ["v1_26"] }

image = "0.25.9"
webp = "0.3.1"

# whisper-rs = { version = "0.15.1", features = ["cuda"] } # Toggle on release build
whisper-rs = "0.15.1"
hound = "3.5.1"

anyhow = "1.0.100"
dotenv = "0.15.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
once_cell = "1.21.3"
lapin = "3.7.2"
futures = "0.3.31"
strum_macros = "0.27.2"
strum = { version = "0.27.2", features = ["derive"] }
